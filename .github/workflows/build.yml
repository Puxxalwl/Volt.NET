name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build + test + pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-preview.5.26302.115'

      - name: Build
        run: dotnet build Volt.slnx -c Release
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test (unit + compiler + E2E on both transports)
        run: |
          set -o pipefail
          status=0
          dotnet test Volt.slnx -c Release --no-build 2>&1 | tee test-output.log || status=$?
          # surface failing tests as annotations + summary (job logs need admin rights)
          {
            echo "### Test failures"
            echo '```'
            grep -E "FAIL|Не пройден|error CS" test-output.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            encoded=$(grep -E "FAIL|Не пройден" test-output.log | grep -v "Failed!" | head -12 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
            tail_enc=$(tail -c 2500 test-output.log | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
            echo "::error::failing tests:%0A$encoded%0A--- tail of output ---%0A$tail_enc"
            exit "$status"
          fi
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Pack
        run: |
          set -euo pipefail
          # version: tag v0.4.0 → 0.4.0; CI builds get a timestamped dev version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for p in Volt.Core Volt.Compiler Volt.Kestrel Volt.Server Volt.Hydration.JS Volt.Cli Volt.Testing; do
            dotnet pack "src/$p/$p.csproj" -c Release -o artifacts -p:Version="$VERSION"
          done
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Smoke-test the packages like a consumer
        # consumes the nupkgs from a local feed — validates the analyzer package,
        # the auto-imported props and the hydrate.js dependency flow
        run: |
          set -euo pipefail
          mkdir -p ~/smoke/VoltConsumer && cd ~/smoke/VoltConsumer
          cat > VoltConsumer.csproj <<'CS'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Volt.Server" Version="$VERSION" />
              <PackageReference Include="Volt.Compiler" Version="$VERSION" PrivateAssets="all"
                                OutputItemType="Analyzer" ReferenceOutputAssembly="false" />
            </ItemGroup>
          </Project>
          CS
          sed -i "s/\$VERSION/$VERSION/g" VoltConsumer.csproj
          mkdir -p Pages wwwroot
          printf '@page /\n@mode SSG\n\n<h1>smoke</h1>\n' > Pages/Index.volt
          printf 'body { margin: 0 }\n' > wwwroot/app.css
          printf 'using Volt;\nusing Volt.Server;\n\nreturn VoltServerApp.Run(args);\n' > Program.cs
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" -n local
          DOTNET_ROLL_FORWARD=Major dotnet build -c Release
        env:
          DOTNET_ROLL_FORWARD: Major

  publish:
    name: publish to nuget.org (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # must match the trusted publishing policy registered on nuget.org
    environment: prod
    permissions:
      id-token: write  # GitHub OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Puxxalwl

      - name: Push
        run: |
          set -euo pipefail
          # locate the nupkgs wherever the artifact got extracted
          mapfile -t packages < <(find . -name '*.nupkg' -type f | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no .nupkg files found after artifact download"
            exit 1
          fi
          echo "Pushing ${#packages[@]} packages"
          # NOTE: dotnet nuget push exits 0 even on 403/401 rejections (observed on
          # SDK 11 preview) — capture the output and fail explicitly on errors.
          for pkg in "${packages[@]}"; do
            echo "::group::push ${pkg##*/}"
            output=$(dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://www.nuget.org/api/v2/package \
              --skip-duplicate 2>&1) || true
            echo "$output"
            echo "$output" >> push-output.log
            echo "::endgroup::"
            # NOTE: "already exists" 409s are the designed --skip-duplicate skip — not failures
            if grep -qiE "error:|forbidden|unauthorized" <<<"$output" && ! grep -q "already exists" <<<"$output"; then
              encoded=$(printf '%s' "$output" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')
              echo "::error::push failed for ${pkg##*/}:%0A$encoded"
              exit 1
            fi
          done
          {
            echo "### NuGet push output"
            echo '```'
            cat push-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # M6.9: the demo site (apps/demo) — static export via `volt export`, served by GitHub Pages
  deploy-demo:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: daily
      - name: Export static site
        run: |
          cd apps/demo
          VOLT_RUN_MODE=export VOLT_EXPORT_DIR="$GITHUB_WORKSPACE/dist" \
            VOLT_BASE_URL=https://puxxalwl.github.io/Volt.NET DOTNET_ROLL_FORWARD=Major dotnet run -c Release
          echo "--- exported files ---"
          find ../../dist -type f | sort
      - name: Ensure .nojekyll (underscore dirs like _volt/ must be served as-is)
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          # unique per attempt: a re-run would otherwise create a second artifact
          # with the default name and deploy-pages fails on "multiple artifacts"
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
